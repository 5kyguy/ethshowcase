<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>forklore — ETHGlobal Showcase Explorer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>ETHGlobal <span>Showcase</span> Explorer</h1>
    <p id="stats">loading dataset…</p>
  </header>
  <section id="controls">
    <input id="q" type="search" placeholder="Search 14,000+ projects — title, tagline, description…" autocomplete="off" autofocus />
    <div class="filters">
      <select id="event"><option value="">All events</option></select>
      <select id="year"><option value="">All years</option></select>
      <label><input type="checkbox" id="finalist" /> Finalists &amp; winners only</label>
      <span id="count"></span>
    </div>
  </section>
  <main id="results" aria-live="polite"></main>
  <div id="detail" class="hidden" role="dialog">
    <button id="close" aria-label="Close">✕</button>
    <div id="detail-body"></div>
  </div>
  <footer>
    <p>Dataset scraped from <a href="https://ethglobal.com/showcase" target="_blank" rel="noopener">ethglobal.com/showcase</a>.
    All project content © its authors. Built with <a href="https://github.com/5kyguy/forklore" target="_blank" rel="noopener">forklore</a>.</p>
  </footer>
  <script src="./app.js"></script>
</body>
</html>
