name: CF diagnose

# Temporary diagnostic: prints R2 bucket names and Pages project names using
# the repo's Cloudflare secrets, to reconcile names/permissions after setup.
# Safe to delete once the deploys are green.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Secret format check (lengths and charset only, never values)
        env:
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          t=$(printf '%s' "$TOK" | grep -cE '^[A-Za-z0-9_-]+$' || true)
          a=$(printf '%s' "$ACC" | grep -cE '^[0-9a-f]{32}$' || true)
          echo "CLOUDFLARE_API_TOKEN: length=${#TOK} charset=$([ "$t" = 1 ] && echo OK || echo 'INVALID — contains space/newline/quote or other chars')"
          echo "CLOUDFLARE_ACCOUNT_ID: length=${#ACC} format=$([ "$a" = 1 ] && echo 'OK (32 lowercase hex)' || echo 'INVALID — expected 32 lowercase hex chars')"
      - name: Token identity and accessible accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@latest whoami 2>&1 | sed 's/\x1b\[[0-9;]*m//g' || true
      - name: List R2 buckets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest r2 bucket list 2>&1 || true
      - name: List Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest pages project list 2>&1 || true
