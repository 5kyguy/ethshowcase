name: Deploy site to Pages

# Deploys the gh-pages branch (static site built by `scripts/deploy-site.sh`)
# via the artifact-based Pages deployment. Replaces the legacy branch builder,
# which struggles with ~19k-file trees (slow, flaky "Page build failed").
# Note: gh-pages is an orphan branch without this file, so it cannot host the
# push trigger — deploy-site.sh dispatches this workflow after pushing.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # secrets aren't available in job-level if — resolve presence via an output.
  cf-guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  cloudflare:
    # Mirror the same tree to Cloudflare Pages (forklore.skyguy.dev) so the
    # dataset is reachable where github.io is blocked or slow. Requires repo
    # secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID and the custom
    # domain attached once in the dashboard (Pages → forklore → Custom
    # domains). The project itself is created on first run below. Skips
    # silently while the secrets are absent. Note: Pages caps sites at 20k
    # files; this tree is ~19.1k — clean data/p/ in site.rs keeps us under.
    needs: cf-guard
    if: needs.cf-guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest pages project create forklore --production-branch main || echo "project already exists"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest pages deploy . --project-name forklore --branch main --commit-dirty=true
      - name: Attach custom domain + ensure DNS (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          acct="$CLOUDFLARE_ACCOUNT_ID"
          # 1. Attach the domain (200 on create, 409-ish if already attached — both fine).
          code=$(curl -s -o /tmp/dom.json -w '%{http_code}' -X POST \
            "$api/accounts/$acct/pages/projects/forklore/domains" "${auth[@]}" \
            --data '{"name":"forklore.skyguy.dev"}')
          echo "domain attach status: $code"
          # 2. Resolve the project's pages.dev subdomain.
          sub=$(curl -s "${auth[@]}" "$api/accounts/$acct/pages/projects/forklore" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
          echo "project subdomain: $sub"
          # 3. Zone id: prefer the zone_id on the attached domain object (no
          #    zone-read permission needed), fall back to a zones lookup.
          zone=$(curl -s "${auth[@]}" "$api/accounts/$acct/pages/projects/forklore/domains" | python3 -c "import json,sys; ds=json.load(sys.stdin)['result']; d=next((x for x in ds if x['name']=='forklore.skyguy.dev'), None); print((d or {}).get('zone_id') or '')")
          if [ -z "$zone" ]; then
            zone=$(curl -s "${auth[@]}" "$api/zones?name=skyguy.dev" | python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else '')")
          fi
          if [ -z "$zone" ]; then
            echo "::warning::could not look up the skyguy.dev zone — click 'Activate Domain' for forklore.skyguy.dev in the Pages dashboard once."
            exit 0
          fi
          # 4. Create the proxied CNAME if missing (what the dashboard's
          #    "Activate Domain" button does).
          existing=$(curl -s "${auth[@]}" "$api/zones/$zone/dns_records?name=forklore.skyguy.dev" \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["result"]))')
          if [ "$existing" = "0" ]; then
            curl -s -o /tmp/dns.json -w "dns record create: %{http_code}\n" -X POST \
              "$api/zones/$zone/dns_records" "${auth[@]}" \
              --data "{\"type\":\"CNAME\",\"name\":\"forklore\",\"content\":\"$sub.pages.dev\",\"proxied\":true}"
            cat /tmp/dns.json; echo
          else
            echo "dns record already present"
          fi
